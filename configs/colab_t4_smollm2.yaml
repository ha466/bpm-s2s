# Google Colab T4 GPU Preset: SmolLM2-135M Backbone + Native Mimi Audio Tokens (Q=8, V=2048)
model: {Q: 8, V: 2048, backbone: smollm2, d: 128, K: 4,
        pretrained_name: "HuggingFaceTB/SmolLM2-135M", freeze_backbone: true,
        ref_d: 96, ref_layers: 2, ref_heads: 4, refine_steps: 4, kind: bpm}
train: {steps: 1000, batch: 16, lr: 0.001, warmup: 50, seed: 42, log_every: 50, T: 64, out: runs/colab_t4_smollm2}
